<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Core | MaxiQueen OS Turbo</title>
    <style>
        :root {
            --bg: #000000; /* Negro absoluto de terminal */
            --primary: #00f2ff; /* Cian neón resplandeciente */
            --accent: #0055ff; /* Azul cobalto eléctrico */
            --error: #ff0055; /* Alerta roja digital */
            --text: #f8fafc;
            --success: #38bdf8;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #001533 0%, #000000 100%);
        }

        .os-header {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0, 242, 255, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 5;
        }

        .os-title {
            margin: 0; 
            font-size: 1.1rem; 
            letter-spacing: 3px;
            font-weight: bold;
            text-shadow: 0 0 10px var(--primary);
        }

        canvas {
            background: #000000;
            display: block;
            margin: 20px auto;
            border: 2px solid var(--accent);
            border-radius: 6px;
            box-shadow: 0 0 35px rgba(0, 85, 255, 0.3);
            cursor: crosshair;
        }

        .stats-container {
            position: absolute;
            top: 90px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 4;
        }

        .glass-card {
            background: rgba(0, 5, 15, 0.85);
            padding: 14px;
            border-radius: 6px;
            border: 1px solid var(--accent);
            box-shadow: 0 0 15px rgba(0, 85, 255, 0.1);
            backdrop-filter: blur(5px);
            min-width: 140px;
        }

        .stat-val {
            font-size: 1.6rem; 
            font-weight: bold; 
            font-family: monospace;
            text-shadow: 0 0 8px currentColor;
        }

        .level-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 25px var(--primary);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            letter-spacing: 5px;
            z-index: 10;
            background: rgba(0,0,0,0.9);
            padding: 20px 40px;
            border: 1px solid var(--primary);
        }
    </style>
</head>
<body>

<div class="os-header">
    <h2 class="os-title">MAXIQUEEN <span style="color:var(--primary)">SEC_CORE_v3.0</span></h2>
    <div id="level-display" style="font-weight: bold; color: var(--primary); letter-spacing: 1px;">NIVEL: 1</div>
</div>

<div class="stats-container">
    <div class="glass-card">
        <div style="font-size: 0.65rem; color: #64748b; letter-spacing: 1px;">DATOS RED</div>
        <div id="credits" class="stat-val" style="color: var(--primary);">500</div>
    </div>
    <div class="glass-card">
        <div style="font-size: 0.65rem; color: #64748b; letter-spacing: 1px;">INTEGRIDAD</div>
        <div id="health" class="stat-val" style="color: #00ff66;">100%</div>
    </div>
    <div class="glass-card">
        <div style="font-size: 0.65rem; color: #64748b; letter-spacing: 1px;">AMENAZAS RESTANTES</div>
        <div id="enemy-count" class="stat-val" style="color: var(--text); font-size: 1.3rem;">10</div>
    </div>
</div>

<div id="level-up-text" class="level-banner">NIVEL OPTIMIZADO</div>

<canvas id="gameCanvas" width="450" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- MOTOR SINTETIZADOR DE AUDIO (Autónomo sin archivos) ---
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'laser') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    } else if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    } else if (type === 'level') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.setValueAtTime(450, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.35);
    } else if (type === 'alert') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
}

// --- ASISTENTE DE VOZ MAXIQUEEN ---
function speakMaxiQueen(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-LA'; 
        utterance.rate = 1.1;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
    }
}

// --- CONFIGURACIÓN E INTERRUPTORES DE JUEGO ---
let gameState = {
    level: 1,
    credits: 600,
    health: 100,
    enemiesToSpawn: 10,
    enemiesKilled: 0,
    isTransitioning: false,
    started: false
};

let towers = [];
let enemies = [];
let bullets = [];
let particles = [];
let frames = 0;
let mousePos = { x: 0, y: 0 };

// Rastreo de mouse para matriz de escaneo táctico
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;
});

// Partículas de datos al destruir virus
function createSparks(x, y) {
    for (let i = 0; i < 8; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            alpha: 1,
            size: Math.random() * 3 + 1
        });
    }
}

class Tower {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.range = 140;
        this.cooldown = 0;
        this.fireRate = 20;
    }
    draw() {
        ctx.save();
        ctx.shadowBlur = 18;
        ctx.shadowColor = "#00f2ff";
        
        // Anillo de acoplamiento cuántico
        ctx.strokeStyle = "rgba(0, 85, 255, 0.6)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 16, 0, Math.PI * 2);
        ctx.stroke();

        // Núcleo central emisor
        ctx.fillStyle = "#00f2ff";
        ctx.beginPath();
        ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    update() {
        if (this.cooldown > 0) this.cooldown--;
        if (this.cooldown === 0) {
            const target = enemies.find(e => Math.hypot(e.x - this.x, e.y - this.y) < this.range);
            if (target) {
                bullets.push(new Projectile(this.x, this.y, target));
                playSound('laser');
                this.cooldown = this.fireRate;
            }
        }
    }
}

class Enemy {
    constructor(level) {
        this.x = Math.random() * (canvas.width - 60) + 30;
        this.y = -30;
        this.hp = 2 + Math.floor(level * 0.8);
        this.maxHp = this.hp;
        this.speed = 1.2 + (level * 0.15);
        this.value = 25 + (level * 3);
    }
    draw() {
        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#0055ff";
        
        // Forma geométrica digital (Rombo cibernético)
        ctx.fillStyle = "#0055ff";
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 12);
        ctx.lineTo(this.x + 10, this.y);
        ctx.lineTo(this.x, this.y + 12);
        ctx.lineTo(this.x - 10, this.y);
        ctx.closePath();
        ctx.fill();

        // Núcleo inestable interno
        ctx.fillStyle = "#00f2ff";
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fill();

        // Micro barra de datos de vida
        ctx.fillStyle = "#111827";
        ctx.fillRect(this.x - 15, this.y - 20, 30, 3);
        ctx.fillStyle = "#00f2ff";
        ctx.fillRect(this.x - 15, this.y - 20, (this.hp / this.maxHp) * 30, 3);
        ctx.restore();
    }
    update() {
        this.y += this.speed;
    }
}

class Projectile {
    constructor(x, y, target) {
        this.x = x; this.y = y; this.target = target;
        this.speed = 10;
        this.lastX = x; this.lastY = y;
    }
    draw() {
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#00f2ff";
        ctx.strokeStyle = "#00f2ff";
        ctx.lineWidth = 3;
        // Efecto Haz de Luz / Estela digital
        ctx.beginPath();
        ctx.moveTo(this.lastX, this.lastY);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();
        ctx.restore();
    }
    update() {
        this.lastX = this.x;
        this.lastY = this.y;
        const dx = this.target.x - this.x;
        const dy = this.target.y - this.y;
        const dist = Math.hypot(dx, dy);
        
        if (dist > 1) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }
}

// --- SISTEMA DE FLUJO DIGITAL ---
function drawCyberGrid() {
    ctx.strokeStyle = "rgba(0, 85, 255, 0.06)";
    ctx.lineWidth = 1;
    const gridSize = 30;
    for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }
}

function nextLevel() {
    gameState.isTransitioning = true;
    playSound('level');
    speakMaxiQueen(`Nivel ${gameState.level} completado. Optimizando firewalls.`);
    
    const banner = document.getElementById("level-up-text");
    banner.style.opacity = "1";

    setTimeout(() => {
        gameState.level++;
        gameState.enemiesToSpawn = 10 + (gameState.level * 4);
        gameState.enemiesKilled = 0;
        gameState.isTransitioning = false;
        banner.style.opacity = "0";
        document.getElementById("level-display").innerText = "NIVEL: " + gameState.level;
        updateUI();
    }, 2000);
}

function updateUI() {
    document.getElementById("credits").innerText = gameState.credits;
    document.getElementById("health").innerText = gameState.health + "%";
    
    const hpDisplay = document.getElementById("health");
    if(gameState.health < 40) {
        hpDisplay.style.color = "var(--error)";
    } else {
        hpDisplay.style.color = "#00ff66";
    }
    
    const remaining = gameState.enemiesToSpawn - gameState.enemiesKilled;
    document.getElementById("enemy-count").innerText = remaining < 0 ? 0 : remaining;
}

// Interacción táctica al presionar clic
canvas.addEventListener("click", (e) => {
    initAudio();
    if (!gameState.started) {
        gameState.started = true;
        speakMaxiQueen("MaxiQueen en acción. Núcleo de seguridad activo.");
    }

    if (gameState.credits >= 150) {
        const rect = canvas.getBoundingClientRect();
        const tx = e.clientX - rect.left;
        const ty = e.clientY - rect.top;
        
        towers.push(new Tower(tx, ty));
        gameState.credits -= 150;
        
        // Destello de despliegue
        createSparks(tx, ty);
        playSound('hit');
        updateUI();
    } else {
        playSound('alert');
    }
});

function handleParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) {
            particles.splice(i, 1);
        } else {
            ctx.fillStyle = `rgba(0, 242, 255, ${p.alpha})`;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        }
    }
}

function gameLoop() {
    // Fondo de rastro digital continuo
    ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawCyberGrid();

    // Dibujar rango holográfico simulado al intentar construir
    if (gameState.credits >= 150) {
        ctx.strokeStyle = "rgba(0, 242, 255, 0.15)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(mousePos.x, mousePos.y, 140, 0, Math.PI * 2);
        ctx.stroke();
    }

    if (!gameState.isTransitioning && gameState.started) {
        // Generador de flujo enemigo continuo
        if (frames % 50 === 0 && gameState.enemiesToSpawn > (enemies.length + gameState.enemiesKilled)) {
            enemies.push(new Enemy(gameState.level));
        }

        if (gameState.enemiesKilled >= gameState.enemiesToSpawn) {
            nextLevel();
        }
    }

    // Actualizar nodos defensivos
    towers.forEach(t => { t.update(); t.draw(); });

    // Procesar amenazas de datos
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        e.update();
        e.draw();
        
        // Fuga en el sistema de seguridad
        if (e.y > canvas.height) {
            enemies.splice(ei, 1);
            gameState.health -= 10;
            gameState.enemiesKilled++;
            playSound('alert');
            
            if (gameState.health === 30) {
                speakMaxiQueen("Alerta. Integridad del sistema comprometida.");
            }
            if (gameState.health <= 0) {
                gameState.health = 0;
                speakMaxiQueen("Error crítico. Desconexión de red eminente.");
                // Reset automático por resiliencia de software
                gameState.health = 100;
                gameState.credits = 600;
                towers = [];
                enemies = [];
                gameState.level = 1;
                gameState.enemiesToSpawn = 10;
                gameState.enemiesKilled = 0;
            }
            updateUI();
        }
    }

    // Control físico de haces balísticos
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
        const b = bullets[bi];
        b.update();
        b.draw();

        // Validar si el objetivo fue removido del mapa
        if (!enemies.includes(b.target)) {
            bullets.splice(bi, 1);
            continue;
        }

        if (Math.hypot(b.target.x - b.x, b.target.y - b.y) < 12) {
            b.target.hp--;
            playSound('hit');
            createSparks(b.x, b.y);
            bullets.splice(bi, 1);
            
            if (b.target.hp <= 0) {
                const idx = enemies.indexOf(b.target);
                if (idx > -1) {
                    gameState.credits += b.target.value;
                    gameState.enemiesKilled++;
                    enemies.splice(idx, 1);
                    updateUI();
                }
            }
        }
    }

    handleParticles();
    frames++;
    requestAnimationFrame(gameLoop);
}

// Ejecución inicial del entorno
gameLoop();
updateUI();
</script>

</body>
</html>
