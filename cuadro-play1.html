<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Core | MaxiQueen OS Turbo</title>
    <style>
        :root {
            --bg: #050505;
            --primary: #00f2ff;
            --accent: #0055ff;
            --client: #ffaa00; /* Color para el cliente/operador */
            --error: #ff0055;
            --text: #f8fafc;
            --panel-bg: rgba(0, 15, 30, 0.85);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #001533 0%, #000000 100%);
        }

        .os-header {
            width: 100%;
            padding: 12px;
            background: var(--panel-bg);
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0, 242, 255, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 5;
        }

        .os-title {
            margin: 0; 
            font-size: 1.2rem; 
            letter-spacing: 3px;
            font-weight: bold;
            text-shadow: 0 0 10px var(--primary);
        }

        .layout-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            align-items: flex-start;
        }

        canvas {
            background: #000000;
            border: 2px solid var(--accent);
            border-radius: 6px;
            box-shadow: 0 0 35px rgba(0, 85, 255, 0.2);
            cursor: crosshair;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
        }

        .glass-card {
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--accent);
            box-shadow: inset 0 0 15px rgba(0, 85, 255, 0.1);
        }

        .stat-label { font-size: 0.75rem; color: #64748b; letter-spacing: 1px; margin-bottom: 5px;}
        .stat-val { font-size: 1.8rem; font-weight: bold; font-family: monospace; text-shadow: 0 0 8px currentColor; }

        /* Consola de Comunicaciones */
        .comms-log {
            height: 250px;
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .comms-log p { margin: 0; padding: 5px; border-left: 2px solid; background: rgba(255,255,255,0.05); }
        .msg-system { border-color: var(--primary); color: var(--text); }
        .msg-client { border-color: var(--client); color: var(--client); }
        
        /* Ocultar scrollbar */
        .comms-log::-webkit-scrollbar { width: 5px; }
        .comms-log::-webkit-scrollbar-thumb { background: var(--accent); }

        .level-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 25px var(--primary);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            letter-spacing: 5px;
            z-index: 10;
            background: rgba(0,0,0,0.9);
            padding: 20px 40px;
            border: 1px solid var(--primary);
        }
    </style>
</head>
<body>

<div class="os-header">
    <h2 class="os-title">MAXIQUEEN <span style="color:var(--primary)">SEC_CORE_v4.0</span></h2>
    <div id="level-display" style="font-weight: bold; color: var(--primary); letter-spacing: 1px;">NIVEL: 1</div>
</div>

<div class="layout-container">
    <canvas id="gameCanvas" width="500" height="600"></canvas>
    
    <div class="side-panel">
        <div class="glass-card">
            <div class="stat-label">RECURSOS RED (150/TORRE)</div>
            <div id="credits" class="stat-val" style="color: var(--primary);">500</div>
        </div>
        <div class="glass-card">
            <div class="stat-label">INTEGRIDAD DEL SISTEMA</div>
            <div id="health" class="stat-val" style="color: #00ff66;">100%</div>
        </div>
        <div class="glass-card">
            <div class="stat-label">AMENAZAS RESTANTES</div>
            <div id="enemy-count" class="stat-val" style="color: var(--text); font-size: 1.5rem;">10</div>
        </div>
        
        <div class="glass-card" style="flex-grow: 1;">
            <div class="stat-label" style="color: var(--client);">RADIO DE COMUNICACIONES</div>
            <div id="comms" class="comms-log"></div>
        </div>
    </div>
</div>

<div id="level-up-text" class="level-banner">SISTEMA OPTIMIZADO</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const commsLog = document.getElementById("comms");

// --- MOTOR DE AUDIO SINTÉTICO (Efectos) ---
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'laser') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'build') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }
}

// --- SISTEMA DE CONVERSACIONES DE VOZ (IA vs Cliente) ---
let isSpeaking = false;
let dialogueQueue = [];

function addLogMessage(sender, text) {
    const p = document.createElement("p");
    p.className = sender === "MaxiQueen" ? "msg-system" : "msg-client";
    p.innerHTML = `<strong>[${sender}]</strong>: ${text}`;
    commsLog.appendChild(p);
    commsLog.scrollTop = commsLog.scrollHeight;
}

function processDialogueQueue() {
    if (isSpeaking || dialogueQueue.length === 0) return;
    
    isSpeaking = true;
    const dialog = dialogueQueue.shift();
    addLogMessage(dialog.actor, dialog.text);

    if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(dialog.text);
        utterance.lang = 'es-MX'; 
        
        // Configuración de voz según el actor
        if (dialog.actor === "Cliente") {
            utterance.pitch = 0.6; // Voz más grave para el operador
            utterance.rate = 1.0;
        } else {
            utterance.pitch = 1.2; // Voz más digital/femenina para MaxiQueen
            utterance.rate = 1.1;
        }

        utterance.onend = () => {
            isSpeaking = false;
            setTimeout(processDialogueQueue, 400); // Pausa entre diálogos
        };
        
        window.speechSynthesis.speak(utterance);
    } else {
        isSpeaking = false;
        processDialogueQueue();
    }
}

function queueConversation(conversationArray) {
    conversationArray.forEach(line => dialogueQueue.push(line));
    processDialogueQueue();
}

// --- VARIABLES DEL ENTORNO ---
let gameState = {
    level: 1, credits: 500, health: 100,
    enemiesToSpawn: 10, enemiesKilled: 0,
    started: false, isTransitioning: false
};

let towers = [], enemies = [], bullets = [], particles = [];
let frames = 0, mousePos = { x: 0, y: 0 };

// Rastreo de Mouse
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;
});

// Partículas
function createSparks(x, y, color = "#00f2ff") {
    for (let i = 0; i < 10; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            alpha: 1, size: Math.random() * 3 + 1, color: color
        });
    }
}

// --- CLASES DEL JUEGO ---
class Tower {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.range = 140; this.cooldown = 0; this.fireRate = 25;
    }
    draw() {
        ctx.save();
        ctx.shadowBlur = 15; ctx.shadowColor = "#00f2ff";
        ctx.strokeStyle = "rgba(0, 85, 255, 0.8)";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(this.x, this.y, 16, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = "#00f2ff";
        ctx.beginPath(); ctx.arc(this.x, this.y, 6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
    update() {
        if (this.cooldown > 0) this.cooldown--;
        if (this.cooldown === 0) {
            const target = enemies.find(e => Math.hypot(e.x - this.x, e.y - this.y) < this.range);
            if (target) {
                bullets.push(new Projectile(this.x, this.y, target));
                playSound('laser');
                this.cooldown = this.fireRate;
            }
        }
    }
}

class Enemy {
    constructor(level) {
        this.x = Math.random() * (canvas.width - 60) + 30;
        this.y = -30;
        this.hp = 2 + Math.floor(level * 1.2);
        this.maxHp = this.hp;
        this.speed = 1.0 + (level * 0.2);
        this.value = 30 + (level * 5);
    }
    draw() {
        ctx.save();
        ctx.shadowBlur = 10; ctx.shadowColor = "#ff0055";
        ctx.fillStyle = "#ff0055"; // Enemigos rojos
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 12); ctx.lineTo(this.x + 10, this.y);
        ctx.lineTo(this.x, this.y + 12); ctx.lineTo(this.x - 10, this.y);
        ctx.closePath(); ctx.fill();
        
        // Barra de vida
        ctx.fillStyle = "#111"; ctx.fillRect(this.x - 15, this.y - 20, 30, 4);
        ctx.fillStyle = "#00ff66"; ctx.fillRect(this.x - 15, this.y - 20, (this.hp / this.maxHp) * 30, 4);
        ctx.restore();
    }
    update() { this.y += this.speed; }
}

class Projectile {
    constructor(x, y, target) {
        this.x = x; this.y = y; this.target = target;
        this.speed = 12; this.lastX = x; this.lastY = y;
    }
    draw() {
        ctx.save();
        ctx.shadowBlur = 10; ctx.shadowColor = "#00f2ff";
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(this.lastX, this.lastY); ctx.lineTo(this.x, this.y); ctx.stroke();
        ctx.restore();
    }
    update() {
        this.lastX = this.x; this.lastY = this.y;
        const dx = this.target.x - this.x, dy = this.target.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 1) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }
}

// --- LOGICA PRINCIPAL ---
function drawCyberGrid() {
    ctx.strokeStyle = "rgba(0, 85, 255, 0.08)"; ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
    for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
}

function updateUI() {
    document.getElementById("credits").innerText = gameState.credits;
    const hpDisplay = document.getElementById("health");
    hpDisplay.innerText = gameState.health + "%";
    hpDisplay.style.color = gameState.health < 40 ? "var(--error)" : "#00ff66";
    const remaining = gameState.enemiesToSpawn - gameState.enemiesKilled;
    document.getElementById("enemy-count").innerText = remaining < 0 ? 0 : remaining;
}

canvas.addEventListener("click", (e) => {
    initAudio();
    if (!gameState.started) {
        gameState.started = true;
        // CONVERSACIÓN INICIAL
        queueConversation([
            { actor: "Cliente", text: "MaxiQueen, inicia el protocolo de defensa. Necesito la red segura para el lanzamiento." },
            { actor: "MaxiQueen", text: "Entendido. Escudos de red activos. Detectando tráfico malicioso entrante." },
            { actor: "Cliente", text: "Despliega los nodos holográficos, no dejes que extraigan los datos." }
        ]);
    }

    if (gameState.credits >= 150) {
        const rect = canvas.getBoundingClientRect();
        towers.push(new Tower(e.clientX - rect.left, e.clientY - rect.top));
        gameState.credits -= 150;
        createSparks(e.clientX - rect.left, e.clientY - rect.top, "#0055ff");
        playSound('build');
        updateUI();
    }
});

function gameLoop() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawCyberGrid();

    if (gameState.credits >= 150) {
        ctx.strokeStyle = "rgba(0, 242, 255, 0.2)";
        ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, 140, 0, Math.PI * 2); ctx.stroke();
    }

    if (!gameState.isTransitioning && gameState.started) {
        if (frames % 60 === 0 && gameState.enemiesToSpawn > (enemies.length + gameState.enemiesKilled)) {
            enemies.push(new Enemy(gameState.level));
        }

        if (gameState.enemiesKilled >= gameState.enemiesToSpawn) {
            gameState.isTransitioning = true;
            document.getElementById("level-up-text").style.opacity = "1";
            
            // CONVERSACIÓN DE CAMBIO DE NIVEL
            queueConversation([
                { actor: "MaxiQueen", text: `Oleada ${gameState.level} eliminada. Optimizando ancho de banda.` },
                { actor: "Cliente", text: "Buen trabajo. Prepárate, los ataques se volverán más agresivos." }
            ]);

            setTimeout(() => {
                gameState.level++;
                gameState.enemiesToSpawn = 10 + (gameState.level * 5);
                gameState.enemiesKilled = 0;
                gameState.isTransitioning = false;
                document.getElementById("level-up-text").style.opacity = "0";
                document.getElementById("level-display").innerText = "NIVEL: " + gameState.level;
                updateUI();
            }, 5000);
        }
    }

    towers.forEach(t => { t.update(); t.draw(); });

    for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        e.update(); e.draw();
        
        if (e.y > canvas.height) {
            enemies.splice(ei, 1);
            gameState.health -= 10;
            gameState.enemiesKilled++;
            
            if (gameState.health === 50) {
                queueConversation([{ actor: "Cliente", text: "¡Cuidado MaxiQueen! Están perforando el firewall. ¡Defiende los puertos!" }]);
            }

            if (gameState.health <= 0) {
                gameState.health = 100; gameState.credits = 500;
                towers = []; enemies = []; gameState.level = 1;
                gameState.enemiesToSpawn = 10; gameState.enemiesKilled = 0;
                queueConversation([
                    { actor: "MaxiQueen", text: "Falla crítica en el sistema. Los datos han sido comprometidos." },
                    { actor: "Cliente", text: "¡Maldición! Reinicia los servidores, tenemos que intentarlo de nuevo." }
                ]);
            }
            updateUI();
        }
    }

    for (let bi = bullets.length - 1; bi >= 0; bi--) {
        const b = bullets[bi];
        b.update(); b.draw();

        if (!enemies.includes(b.target)) { bullets.splice(bi, 1); continue; }

        if (Math.hypot(b.target.x - b.x, b.target.y - b.y) < 15) {
            b.target.hp--;
            playSound('hit');
            createSparks(b.x, b.y, "#ff0055");
            bullets.splice(bi, 1);
            
            if (b.target.hp <= 0) {
                const idx = enemies.indexOf(b.target);
                if (idx > -1) {
                    gameState.credits += b.target.value;
                    gameState.enemiesKilled++;
                    enemies.splice(idx, 1);
                    updateUI();
                }
            }
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
        if (p.alpha <= 0) particles.splice(i, 1);
        else {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            ctx.globalAlpha = 1;
        }
    }

    frames++;
    requestAnimationFrame(gameLoop);
}

updateUI();
gameLoop();
</script>

</body>
</html>
